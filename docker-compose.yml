services:
  db:
    image: postgres:16
    container_name: passe-db
    environment:
      POSTGRES_USER: passe
      POSTGRES_PASSWORD: passe
      POSTGRES_DB: passe
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U passe -d passe"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db_data: